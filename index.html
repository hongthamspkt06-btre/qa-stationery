<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QA STATIONERY PURCHASE</title>
<style>
  :root{
    --navy:#1B3A63;
    --green:#1E8E5A;
    --green-hover:#187a4d;
    --bg:#D5D8DC;
    --white:#FFFFFF;
    --border:#C3C8CE;
    --text:#232A31;
    --text-muted:#5C6670;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; background:var(--bg);
    font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;
    color:var(--text); font-size:12px;
  }
  body *{ font-family:inherit; }
  .page{ padding:4.76mm; max-width:1221.6px; margin:0 auto; }

  /* Header */
  .header-bar{
    height:15mm; background:var(--navy); border-radius:4px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; color:var(--white);
  }
  .header-title{ font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .btn-export{
    height:9.4mm; background:var(--green); color:var(--white); border:none; border-radius:4px;
    font-size:13px; font-weight:700; padding:0 18px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:background 0.15s ease;
  }
  .btn-export:hover{ background:var(--green-hover); }
  .btn-export:active{ transform:translateY(1px); }
  .btn-export:disabled{ opacity:0.6; cursor:wait; }
  .header-right{ display:flex; align-items:center; gap:10px; }
  .sync-chip{
    font-size:11px; font-weight:600; padding:3px 10px; border-radius:11px; white-space:nowrap;
    background:rgba(255,255,255,0.14); display:inline-flex; align-items:center; gap:6px;
  }
  .sync-chip::before{ content:''; width:8px; height:8px; border-radius:50%; background:#9AA5B1; flex:none; }
  .sync-chip[data-state="synced"]::before{ background:#3DDC84; }
  .sync-chip[data-state="loading"]::before, .sync-chip[data-state="saving"]::before{ background:#F5C542; }
  .sync-chip[data-state="offline"]::before, .sync-chip[data-state="error"]::before, .sync-chip[data-state="noapi"]::before{ background:#FF6B6B; }
  .btn-reload{
    height:9.4mm; background:transparent; color:var(--white); border:1px solid rgba(255,255,255,0.55); border-radius:4px;
    font-size:13px; font-weight:600; padding:0 12px; cursor:pointer;
  }
  .btn-reload:hover{ background:rgba(255,255,255,0.12); }
  .btn-export svg{ width:14px; height:14px; flex:none; }

  /* Tabs */
  .tabs{ display:flex; gap:8px; margin-top:4.76mm; }
  .tab-btn{
    font-size:14px; font-weight:600; background:var(--white); color:var(--text);
    border:1px solid #C9CDD2; padding:9px 22px; cursor:pointer; border-radius:6px;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn:hover:not(.active){ background:#F2F3F5; }
  .tab-btn.active{ color:var(--white); background:var(--navy); border-color:var(--navy); font-weight:700; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* Blocks */
  .block{
    background:var(--white); border-radius:4px; border:1px solid var(--border);
    margin-top:4.76mm; padding:16px;
  }
  .block-title{ font-size:14px; font-weight:700; color:var(--navy); margin:0; }
  #entry-block{ padding:10px 16px; }
  .entry-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .field-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) repeat(2, minmax(0,3fr)) repeat(2, minmax(0,1fr)); gap:8px 10px; align-items:end; }
  .field input[readonly]{ background:#F2F4F6; color:var(--text); cursor:default; }
  @media (max-width:900px){ .field-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } .field-grid .field:nth-child(4), .field-grid .field:nth-child(5){ grid-column:span 2; } }
  .field{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .field label{
    font-size:11px; font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .field input[type="date"],
  .field input[type="text"],
  .field input[type="number"],
  .field select,
  .field textarea{
    font-family:inherit; font-size:12px; color:var(--text); background:var(--white);
    border:1px solid #C9CDD2; border-radius:4px; padding:6px 8px; outline:none;
    transition:border-color 0.15s ease; width:100%; min-width:0;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--navy); }
  .field input[type="text"], .field input[type="number"], .field select{ height:30px; }
  .entry-table-wrap::-webkit-scrollbar{ width:12px; height:12px; }
  .entry-table-wrap::-webkit-scrollbar-track{ background:#EEF0F2; }
  .entry-table-wrap::-webkit-scrollbar-thumb{ background:#B5BCC4; border-radius:6px; border:2px solid #EEF0F2; }
  .entry-table-wrap::-webkit-scrollbar-thumb:hover{ background:#8F98A2; }
  .entry-table-wrap{ scrollbar-color:#B5BCC4 #EEF0F2; }
  .field textarea{ resize:vertical; min-height:30px; height:30px; }

  .combo{ position:relative; }
  .combo-list{
    position:absolute; left:0; right:0; min-width:min(440px, 90vw); top:calc(100% + 2px); z-index:60; max-height:264px; overflow-y:auto;
    background:var(--white); border:1px solid var(--navy); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,0.18);
  }
  .combo-list[hidden]{ display:none; }
  .combo-opt{ padding:6px 8px; cursor:pointer; border-bottom:1px solid #EEF0F2; line-height:1.3; }
  .combo-opt:last-child{ border-bottom:none; }
  .combo-opt .vn{ font-size:12px; color:var(--text); }
  .combo-opt .en{ font-size:11px; color:var(--text-muted); }
  .combo-opt.active{ background:#DCE9F8; }
  .combo-opt mark{ background:#FFE9A8; color:inherit; padding:0; }
  .combo-empty{ padding:8px; font-size:12px; color:var(--text-muted); }
  .btn-add{
    height:9.4mm; background:#3B7DDE; color:var(--white); border:none; border-radius:8px;
    font-size:13px; font-weight:700; padding:0 18px; cursor:pointer; flex:none;
  }
  .btn-add:hover{ background:#2E68C4; }
  .entry-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .btn-copyprev{
    height:9.4mm; background:var(--bg); color:var(--navy); border:1px solid var(--navy); border-radius:8px;
    font-size:13px; font-weight:700; padding:0 16px; cursor:pointer; flex:none; white-space:nowrap;
  }
  .btn-copyprev:hover{ background:#C3C8CE; }
  .entry-list-empty{ font-size:12px; color:var(--text-muted); padding:8px 0; }

  /* Entry List: grows with data, capped at ~3x the Entry block height (set by JS) */
  #entry-list-block{ display:flex; flex-direction:column; max-height:var(--entry-list-max, none); }
  #entryListContainer{ display:flex; flex-direction:column; flex:0 1 auto; min-height:0; margin-top:10px; }
  .entry-table-wrap{
    flex:0 1 auto; min-height:0; overflow-x:hidden; overflow-y:auto;
    border:1px solid var(--border); border-radius:4px;
  }
  /* Entry List = matrix like sheet "order" (A:V). Columns A:E stay frozen while scrolling sideways. */
  .entry-table-wrap{ overflow-x:auto; }
  table.entry-table{ table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:12px; min-width:100%; }
  table.entry-table th, table.entry-table td{
    text-align:center; vertical-align:middle; padding:6px 2px;
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    white-space:normal; overflow-wrap:anywhere; background:var(--white);
  }
  table.entry-table th:last-child, table.entry-table td:last-child{ border-right:none; padding-left:2px; padding-right:2px; }
  table.entry-table tbody td{ height:40px; }
  table.entry-table thead th{
    position:sticky; top:0; z-index:3; color:var(--navy); background:#DCE9F8; font-weight:700; font-size:10px; padding:6px 1px; overflow-wrap:normal;
  }
  table.entry-table th.fz, table.entry-table td.fz{ position:sticky; z-index:2; }
  table.entry-table thead th.fz{ z-index:4; }
  table.entry-table th.fz-last, table.entry-table td.fz-last{ box-shadow:2px 0 0 var(--border); }
  .cell-text{
    line-height:16px; max-height:32px; overflow:hidden;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;
  }
  .cell-left{ text-align:left; padding-left:6px !important; }
  .cell-num{ font-variant-numeric:tabular-nums; }
  .nowrap{ white-space:nowrap !important; overflow-wrap:normal !important; }
  td.qty-cell{ font-weight:600; color:var(--navy); padding-left:1px; padding-right:1px; }
  .qc{ display:flex; align-items:center; justify-content:center; gap:1px; }
  .qc .qv{ font-size:12px; white-space:nowrap; overflow-wrap:normal; }
  .cell-edit{
    flex:none; width:10px; height:10px; padding:0; border:none; background:none; color:var(--navy);
    opacity:0.28; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  }
  .cell-edit:hover, .cell-edit:focus-visible{ opacity:1; color:var(--green); outline:none; }
  .cell-edit svg{ width:9px; height:9px; pointer-events:none; }
  td.col-total{ font-weight:700; background:#F2F4F6 !important; }
  table.entry-table tbody tr:hover td:not(.col-total){ background:#F2F4F6; }
  table.entry-table tfoot td{
    position:sticky; bottom:0; z-index:3; background:#DCE9F8; color:var(--navy); font-weight:700;
    border-top:1px solid var(--border); border-bottom:none; height:34px;
  }
  table.entry-table tfoot td.fz{ z-index:4; }
  .list-period{ font-size:12px; font-weight:600; color:var(--text-muted); margin-left:10px; }
  .list-title-wrap{ display:flex; align-items:baseline; min-width:0; }

  .row-actions{ display:flex; align-items:center; justify-content:center; gap:4px; }
  .row-delete{
    width:18px; height:18px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    background:var(--white); border-radius:4px; cursor:pointer; line-height:1;
  }
  .row-delete{ border:1px solid #E74C3C; color:#E74C3C; font-size:11px; font-weight:700; }
  .row-delete:hover{ background:#FDEDEC; }
  .row-edit{ border:1px solid var(--green); color:var(--green); }
  .row-edit:hover{ background:#E6F5ED; }
  .row-edit svg{ width:10px; height:10px; pointer-events:none; }

  /* Revising indicator */
  .entry-title-wrap{ display:flex; align-items:center; gap:10px; min-width:0; }
  .revising-note{ display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--green); font-weight:600; }
  .revising-note[hidden]{ display:none; }
  .revising-cancel{
    border:1px solid var(--border); background:var(--white); color:var(--text-muted);
    border-radius:4px; font-size:11px; padding:2px 8px; cursor:pointer;
  }
  .revising-cancel:hover{ background:#F2F3F5; }

  /* Entry List header + search */
  .list-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .list-search{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .search-item{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .search-item input, .search-item select{
    font-family:inherit; font-size:12px; font-weight:400; color:var(--text);
    background:var(--white); border:1px solid #C9CDD2; border-radius:4px; padding:5px 8px; outline:none;
  }
  .search-item input{ width:80px; }
  .search-item select{ width:110px; }
  .search-item input:focus, .search-item select:focus{ border-color:var(--navy); }
  .search-clear{
    border:1px solid var(--border); background:var(--white); color:var(--text-muted);
    border-radius:4px; font-size:12px; padding:5px 10px; cursor:pointer;
  }
  .search-clear:hover{ background:#F2F3F5; }

  /* Summary charts */
  #tab-summary .search-item select{ width:110px; }
  .sum-sub{ font-size:11px; color:var(--text-muted); margin:2px 0 8px; min-height:14px; }
  .sum-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:4.76mm; }
  .sum-row .block{ margin-top:4.76mm; }
  @media (max-width:1000px){ .sum-row{ grid-template-columns:minmax(0,1fr); } }
  .chart-svg{ width:100%; height:auto; display:block; }
  .chart-svg text{ font-family:inherit; fill:var(--text); }
  .chart-svg .ax{ fill:var(--text-muted); font-size:10px; }
  .chart-svg .val{ font-size:9px; font-weight:700; fill:var(--navy); }
  .chart-svg .val-prev{ font-size:9px; font-weight:700; fill:#4B5563; }
  .chart-empty{ font-size:12px; color:var(--text-muted); padding:24px 0; text-align:center; }
  .pie-wrap{ display:flex; justify-content:center; }
  .pie-wrap svg{ width:100%; max-width:480px; height:auto; display:block; }
  .vat-total{ font-size:13px; font-weight:700; color:var(--navy); margin-left:14px; }
  .dot{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  .stk-legend{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11px; margin-bottom:8px; }
  .stk-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .stk-row{ display:grid; grid-template-columns:78px minmax(0,1fr) 62px; gap:8px; align-items:center; margin:4px 0; font-size:11px; }
  .stk-row .nm{ font-weight:600; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stk-row .tot{ font-weight:700; color:var(--navy); text-align:right; font-variant-numeric:tabular-nums; }
  .stk-bar{ display:flex; height:20px; border-radius:3px; overflow:hidden; background:#EEF0F2; }
  .stk-bar div{ height:100%; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; overflow:hidden; white-space:nowrap; }
  .items-scroll{ max-height:460px; overflow-y:auto; border:1px solid var(--border); border-radius:4px; padding:4px 8px; }
  .it-row{ display:grid; grid-template-columns:minmax(150px,300px) minmax(0,1fr) 100px; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid #EEF0F2; font-size:12px; }
  .it-row:last-child{ border-bottom:none; }
  .it-row .en{ font-size:10px; color:var(--text-muted); }
  .it-bar{ height:16px; display:flex; align-items:center; gap:6px; min-width:0; }
  .it-bar .fill{ height:14px; background:var(--navy); border-radius:3px; flex:none; }
  .it-bar .lbl{ font-size:11px; font-weight:700; color:var(--navy); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .it-val{ text-align:right; font-variant-numeric:tabular-nums; }
  .it-val b{ color:var(--navy); }
  .it-val .mqty{ display:none; }
  @media (max-width:700px){ .it-row{ grid-template-columns:minmax(0,1fr) 120px; } .it-row .it-bar{ display:none; } .it-val .mqty{ display:inline; } }

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    background:var(--navy); color:var(--white); padding:9px 16px; border-radius:6px;
    font-size:12px; font-weight:600; z-index:200; max-width:90vw; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast[hidden]{ display:none; }
  .toast.error{ background:#C0392B; }

  /* Confirm dialog */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,30,45,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-card{
    background:var(--white); border-radius:8px; border:1px solid var(--border);
    box-shadow:0 8px 28px rgba(0,0,0,0.25); padding:20px 24px; min-width:280px; max-width:100%; text-align:center;
  }
  .modal-message{ font-size:14px; font-weight:700; color:var(--navy); margin-bottom:16px; }
  .modal-actions{ display:flex; justify-content:center; gap:10px; }
  .modal-actions button{ min-width:84px; height:32px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-yes{ background:var(--navy); color:var(--white); border:1px solid var(--navy); }
  .btn-yes:hover{ background:#142c4d; }
  .btn-no{ background:var(--white); color:var(--text); border:1px solid #C9CDD2; }
  .btn-no:hover{ background:#F2F3F5; }
</style>
</head>
<body>

<div class="page">

  <!-- Header -->
  <div class="header-bar">
    <div class="header-title">QA Stationery Purchase</div>
    <div class="header-right">
      <button class="btn-export" id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Export Excel
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="purchase" type="button">Purchase</button>
    <button class="tab-btn" data-tab="summary" type="button">Summary</button>
  </div>

  <!-- Purchase tab -->
  <div class="tab-panel active" id="tab-purchase">
    <div class="block" id="entry-block">
      <div class="entry-header">
        <div class="entry-title-wrap">
          <div class="block-title">Entry</div>
          <span class="revising-note" id="revisingNote" hidden>
            <span id="revisingText"></span>
            <button class="revising-cancel" id="revisingCancel" type="button">Cancel</button>
          </span>
        </div>
        <div class="entry-actions">
          <button class="btn-copyprev" id="copyPrevBtn" type="button">Copy Previous Data</button>
          <button class="btn-add" id="addEntryBtn" type="button">+ Add</button>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="Enter year" min="2000" max="2100" step="1">
        </div>
        <div class="field">
          <label for="month">Month</label>
          <select id="month">
            <option value="">Select</option>
            <option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option>
            <option>May</option><option>Jun</option><option>Jul</option><option>Aug</option>
            <option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option>
          </select>
        </div>
        <div class="field">
          <label for="team">Team</label>
          <select id="team"><option value="">Select</option></select>
        </div>
        <div class="field">
          <label for="itemVN">Stationery(VN)</label>
          <div class="combo" id="itemCombo">
            <input type="text" id="itemVNInput" autocomplete="off" spellcheck="false" placeholder="Type to search..." role="combobox" aria-expanded="false" aria-controls="itemVNList">
            <input type="hidden" id="itemVN">
            <div class="combo-list" id="itemVNList" role="listbox" hidden></div>
          </div>
        </div>
        <div class="field">
          <label for="itemEN">Stationery(EN)</label>
          <input type="text" id="itemEN" readonly tabindex="-1" placeholder="Auto-filled">
        </div>
        <div class="field">
          <label for="unit">Unit</label>
          <input type="text" id="unit" readonly tabindex="-1" placeholder="Auto-filled">
        </div>
        <div class="field">
          <label for="qty">Qty</label>
          <input type="number" id="qty" placeholder="Enter qty" min="0" step="any">
        </div>
      </div>
    </div>

    <div class="block" id="entry-list-block">
      <div class="list-header">
        <div class="list-title-wrap">
          <div class="block-title">Entry List</div>
          <span class="vat-total" id="entryTotalNote"></span>
        </div>
        <div class="list-search">
          <div class="search-item"><label for="searchYear">Year</label><input type="number" id="searchYear" placeholder="All"></div>
          <div class="search-item"><label for="searchMonth">Month</label><select id="searchMonth"></select></div>
        </div>
      </div>
      <div id="entryListContainer">
        <div class="entry-list-empty" id="entryListEmpty">No entries yet.</div>
      </div>
    </div>
  </div>

  <!-- Summary tab (empty) -->
  <div class="tab-panel" id="tab-summary">
    <div class="block">
      <div class="list-header">
        <div class="list-title-wrap">
          <div class="block-title">Cost by Team</div>
          <span class="list-period" id="sumPeriodNote"></span>
        </div>
        <div class="list-search">
          <div class="search-item"><label for="sumYear">Year</label><select id="sumYear"></select></div>
          <div class="search-item"><label for="sumPrevMonth">Previous Month</label><select id="sumPrevMonth"></select></div>
          <div class="search-item"><label for="sumMonth">Current Month</label><select id="sumMonth"></select></div>
        </div>
      </div>
      <div id="chartBar"></div>
    </div>

    <div class="sum-row">
      <div class="block">
        <div class="list-header">
          <div class="block-title">Portion by Team</div>
          <div class="list-search">
            <div class="search-item"><label for="pieYear">Year</label><select id="pieYear"></select></div>
            <div class="search-item"><label for="pieMonth">Month</label><select id="pieMonth"></select></div>
          </div>
        </div>
        <div id="chartPie"></div>
      </div>
      <div class="block">
        <div class="list-header">
          <div class="block-title">Item by Team</div>
          <div class="list-search">
            <div class="search-item"><label for="stkYear">Year</label><select id="stkYear"></select></div>
            <div class="search-item"><label for="stkMonth">Month</label><select id="stkMonth"></select></div>

<script>
  // ---- Config ----
  // Web app URL of the Apps Script deployment (Deploy > Manage deployments > Web app URL, ends with /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbA4ZBCWr68EkC1uifzK0WBoKvkyROyaBhY-taeuyMIOp2dHVRt-Ca0DfM37bz7BDl/exec';
  let PHOTO_IMGS = {}, PHOTO_OF = {};          // photos for the Excel export (loaded from the sheet on first export)

  // ---- Tabs ----
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabPanels = {
    purchase: document.getElementById('tab-purchase'),
    summary: document.getElementById('tab-summary')
  };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(tabPanels).forEach(p => p.classList.remove('active'));
      tabPanels[btn.dataset.tab].classList.add('active');
    });
  });

  // ---- Master data ----
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const TEAMS = ['A&F','AEO','Pink','CostCo','Cotton On','Target','F6 Uniqlo','F7 Uniqlo','F1/F2 WM','F3 WM','F4 WM','F1/F2 PSC','F3/F4 PSC','F6/F7 PSC','F7 Colorist','Office'];
  // Items = tab "list" of the Google Sheet (loaded at start; last copy is kept in this browser)
  let ITEMS = [];
  const ITEM_MAP = {};
  const ITEM_BY_KEY = {};
  const itemKey = s => norm(s).replace(/\s+/g, ' ').trim();
  function canonVN(name){ return ITEM_BY_KEY[itemKey(name)] || name; }
  function setCatalog(list){
    ITEMS = (list || []).map(i => ({ vn: i.vn, en: i.en || '', unit: i.unit || '', price: Number(i.price) || 0 }));
    Object.keys(ITEM_MAP).forEach(k => delete ITEM_MAP[k]);
    Object.keys(ITEM_BY_KEY).forEach(k => delete ITEM_BY_KEY[k]);
    ITEMS.forEach(it => {
      ITEM_MAP[it.vn] = it;
      ITEM_BY_KEY[itemKey(it.vn)] = it.vn;
      it._k = norm(it.vn + ' ' + it.en);
    });
  }

  // ---- State ----
  // entries = unique (year, month, team, itemVN) -> qty. Entry List below is a matrix built from them.
  const entries = [];
  const entryListContainer = document.getElementById('entryListContainer');
  // Columns F:U of sheet "order" (head = column header, team = value of the Team dropdown)
  const TEAM_COLS = TEAMS.map(t => ({ team: t, head: t }));
  let nextEntryId = 1;
  let editingId = null;

  function escapeHtml(str){
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
  function attr(str){ return escapeHtml(str).replace(/"/g, '&quot;'); }
  function optionsHtml(list){
    return list.map(v => `<option value="${attr(v)}">${escapeHtml(v)}</option>`).join('');
  }
  function fmtNum(n){
    const x = Math.round(Number(n) * 1000) / 1000;
    return x.toLocaleString('en-US', { maximumFractionDigits: 3 });
  }

  // ---- Populate dropdowns ----
  const yearEl = document.getElementById('year');
  const monthEl = document.getElementById('month');
  const teamEl = document.getElementById('team');
  const itemVNEl = document.getElementById('itemVN');
  const itemENEl = document.getElementById('itemEN');
  const unitEl = document.getElementById('unit');
  const qtyEl = document.getElementById('qty');
  teamEl.innerHTML = '<option value="">Select</option>' + optionsHtml(TEAMS);
  const comboInput = document.getElementById('itemVNInput');
  const comboList = document.getElementById('itemVNList');

  function syncItem(){
    const it = ITEM_MAP[itemVNEl.value];
    itemENEl.value = it ? it.en : '';
    unitEl.value = it ? it.unit : '';
    if(it) comboInput.value = it.vn;
  }

  // ---- Searchable Stationery(VN) dropdown ----
  // Matches VN and EN names, ignores case and Vietnamese diacritics; every typed word must appear.
  function norm(s){
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  let comboMatches = [], comboActive = -1;

  function highlight(text, terms){
    if(!terms.length) return escapeHtml(text);
    const n = norm(text);
    const mask = new Array(text.length).fill(false);
    terms.forEach(tm => {
      let p = n.indexOf(tm);
      while(p !== -1){ for(let k = p; k < p + tm.length && k < mask.length; k++) mask[k] = true; p = n.indexOf(tm, p + tm.length); }
    });
    let out = '', open = false;
    for(let k = 0; k < text.length; k++){
      if(mask[k] && !open){ out += '<mark>'; open = true; }
      if(!mask[k] && open){ out += '</mark>'; open = false; }
      out += escapeHtml(text[k]);
    }
    return open ? out + '</mark>' : out;
  }
  function renderCombo(){
    const terms = norm(comboInput.value).split(/\s+/).filter(Boolean);
    comboMatches = ITEMS.filter(i => terms.every(tm => i._k.includes(tm)));
    if(comboActive >= comboMatches.length) comboActive = comboMatches.length - 1;
    if(!comboMatches.length){
      comboList.innerHTML = '<div class="combo-empty">No match</div>';
    } else {
      comboList.innerHTML = comboMatches.map((i, idx) =>
        `<div class="combo-opt${idx === comboActive ? ' active' : ''}" role="option" data-idx="${idx}">` +
        `<div class="vn">${highlight(i.vn, terms)}</div><div class="en">${highlight(i.en, terms)}</div></div>`).join('');
    }
  }
  function openCombo(){
    comboList.hidden = false; comboInput.setAttribute('aria-expanded', 'true');
    renderCombo();
    const cur = comboList.querySelector('.combo-opt.active');
    if(cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function closeCombo(){
    comboList.hidden = true; comboInput.setAttribute('aria-expanded', 'false'); comboActive = -1;
    // typed text that was not picked: go back to the chosen item (or clear)
    comboInput.value = itemVNEl.value;
  }
  function pickItem(vn){
    itemVNEl.value = vn;
    syncItem();
    comboList.hidden = true; comboInput.setAttribute('aria-expanded', 'false'); comboActive = -1;
  }
  comboInput.addEventListener('focus', () => { comboInput.select(); comboActive = -1; openCombo(); });
  comboInput.addEventListener('click', () => { if(comboList.hidden) openCombo(); });
  comboInput.addEventListener('input', () => {
    itemVNEl.value = ''; itemENEl.value = ''; unitEl.value = '';
    comboActive = 0; openCombo();
  });
  comboInput.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(comboList.hidden) openCombo();
      if(!comboMatches.length) return;
      comboActive = e.key === 'ArrowDown' ? Math.min(comboActive + 1, comboMatches.length - 1) : Math.max(comboActive - 1, 0);
      renderCombo();
      const cur = comboList.querySelector('.combo-opt.active'); if(cur) cur.scrollIntoView({ block: 'nearest' });
    } else if(e.key === 'Enter'){
      if(!comboList.hidden){
        e.preventDefault();
        const pick = comboMatches[comboActive >= 0 ? comboActive : 0];
        if(pick) pickItem(pick.vn);
      }
    } else if(e.key === 'Escape'){
      if(!comboList.hidden){ e.stopPropagation(); closeCombo(); }
    } else if(e.key === 'Tab'){
      if(!comboList.hidden && comboActive >= 0 && comboMatches[comboActive]) pickItem(comboMatches[comboActive].vn);
      else closeCombo();
    }
  });
  comboList.addEventListener('mousedown', e => {            // mousedown: runs before the input loses focus
    const opt = e.target.closest('.combo-opt');
    if(!opt) return;
    e.preventDefault();
    const pick = comboMatches[Number(opt.dataset.idx)];
    if(pick) pickItem(pick.vn);
  });
  comboInput.addEventListener('blur', () => { if(!comboList.hidden) closeCombo(); });

  // ---- Toast ----
  let toastTimer = null;
  function showToast(msg, isError){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (isError ? ' error' : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 6000 : 2500);
  }

  // ---- Local storage (browser only) ----
  const STORAGE_KEY = 'qa_stationery_purchase_entries_v2';
  let lastPeriod = null;                       // Year / Month of the most recently entered data
  function saveLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries: entries, nextId: nextEntryId, lastPeriod: lastPeriod })); }catch(e){}
  }
  function sameKey(a, b){
    return a.year === b.year && a.month === b.month && a.team === b.team && a.itemVN === b.itemVN;
  }
  // Add qty to the entry with the same key, or create it. Returns {entry, previous}
  function upsertEntry(data){
    const found = entries.find(e => sameKey(e, data));
    if(found){
      const previous = found.qty;
      found.qty = Math.round((found.qty + data.qty) * 1000) / 1000;
      return { entry: found, previous: previous };
    }
    const entry = { id: nextEntryId++, year: data.year, month: data.month, team: data.team, itemVN: data.itemVN, qty: data.qty };
    entries.push(entry);
    return { entry: entry, previous: null };
  }
  function loadLocal(){
    try{
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if(Array.isArray(d.entries)){
        d.entries.forEach(e => {
          if(!e || !e.itemVN || !e.team || !e.month || !(Number(e.qty) > 0)) return;
          upsertEntry({ year: Number(e.year), month: e.month, team: e.team, itemVN: e.itemVN, qty: Number(e.qty) });
        });
        if(d.nextId > nextEntryId) nextEntryId = d.nextId;
        if(d.lastPeriod && d.lastPeriod.year && d.lastPeriod.month) lastPeriod = d.lastPeriod;
      }
    }catch(e){}
  }

  // ---- Backend: Google Apps Script web app (Google Sheet = database) ----
  const CATALOG_KEY = 'qa_stationery_catalog_v1';
  const PENDING_KEY = 'qa_stationery_pending_v1';
  const SEEN_KEY = 'qa_stationery_backend_seen_v1';
  const apiConfigured = () => /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
  const opOf = (op, e) => ({ op: op, year: e.year, month: e.month, team: e.team, itemVN: e.itemVN, qty: e.qty });
  let pendingOps = [];                          // changes not yet saved to the sheet (kept in this browser until saved)
  try{ pendingOps = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }catch(e){}
  if(!Array.isArray(pendingOps)) pendingOps = [];

  // GET and POST use simple requests (no custom headers, text/plain body) so the browser sends no CORS preflight
  async function apiGet(params){
    const q = new URLSearchParams(Object.assign({ t: Date.now() }, params));
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + q, { redirect: 'follow' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || 'API error');
    return j;
  }
  async function apiPost(body){
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || 'API error');
    return j;
  }

  const syncEl = document.getElementById('syncStatus');   // chip removed from the page: setSync does nothing visible
  function setSync(state){
    const text = {
      loading: 'Loading…', synced: 'Synced', saving: 'Saving…', noapi: 'API URL not set', error: 'Cannot load data',
      offline: 'Offline · ' + pendingOps.length + ' unsaved'
    }[state];
    if(!syncEl) return;
    syncEl.textContent = text;
    syncEl.dataset.state = state;
  }

  let syncPromise = null, retryTimer = null;
  function scheduleRetry(){ clearTimeout(retryTimer); retryTimer = setTimeout(flushPending, 15000); }
  function flushPending(){
    if(syncPromise) return syncPromise;
    if(!pendingOps.length || !apiConfigured()) return Promise.resolve();
    syncPromise = (async () => {
      setSync('saving');
      try{
        while(pendingOps.length){
          const batch = pendingOps.slice(0, 100);
          await apiPost({ action: 'ops', ops: batch });
          pendingOps.splice(0, batch.length);
          savePending();
        }
        setSync('synced');
      }catch(err){
        setSync('offline');
        scheduleRetry();
      }finally{
        syncPromise = null;
      }
    })();
    return syncPromise;
  }
  function queueOps(ops){
    if(!ops.length) return;

    savePending();
    if(apiConfigured()) flushPending(); else setSync('noapi');
  }
  window.addEventListener('online', flushPending);
  window.addEventListener('beforeunload', e => { if(pendingOps.length){ e.preventDefault(); e.returnValue = ''; } });

        await flushPending();

      try{ localStorage.setItem(CATALOG_KEY, JSON.stringify(j.items)); }catch(e){}

      lastLoadAt = Date.now();

  // Photos are only needed for the Excel export: loaded on first export, shrunk to JPEG in the browser
  const photosState = { loaded: false, force: false };
  function prepareImage(raw){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try{
          const sc = Math.min(1, 300 / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
          resolve({ b: cv.toDataURL('image/jpeg', 0.85).split(',')[1], w: w, h: h });
        }catch(e){ resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = 'data:' + raw.mime + ';base64,' + raw.b64;
    });
  }

  // ---- Render list (matrix: rows = stationery items, columns = teams) ----
  const FZ_W = [30, 111, 111, 36, 58];

  function buildMatrix(list){
    const rowsByItem = new Map();
    list.forEach(e => {

  // ---- Confirm dialog ----

  // ---- Export Excel: builds a real .xlsx in the browser (no library), layout like sheet "order" ----
  const CRC_TABLE = (() => {
    const tb = new Uint32Array(256);
    for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); tb[n] = c >>> 0; }

  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(files){                                   // zip without compression
    const enc = new TextEncoder();
    const u16 = v => [v & 255, (v >> 8) & 255];
    const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
    const parts = [], central = [];
    let offset = 0;
    files.forEach(f => {
      const name = enc.encode(f.name), data = f.bytes || enc.encode(f.text), crc = crc32(data), size = data.length;
      const local = Uint8Array.from([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
        ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0)]);
      parts.push(local, name, data);
      central.push(Uint8Array.from([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
        ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
      offset += local.length + name.length + size;
    });
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = Uint8Array.from([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
    return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function colLetter(i){ let s = '', n = i + 1; while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  const r3 = n => Math.round(n * 1000) / 1000;

  // ---- Workbook layout: copied from sheets "purchase request" and "order" of Stationery_rút gọn.xlsx ----
  const b64bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

  function buildOrderXlsx(shown, title){
    const T = XL_TPL;
    const { itemNames, rowsByItem } = buildMatrix(shown);
    const N = itemNames.length, d = N - 1;
    const str = (ref, text, s) => `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
    const num = (ref, v, s) => `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
    const fml = (ref, f, v, s) => `<c r="${ref}" s="${s}"><f>${xmlEsc(f)}</f><v>${v}</v></c>`;
    const blank = (ref, s) => `<c r="${ref}" s="${s}"/>`;

    const data = itemNames.map(name => {
      const it = ITEM_MAP[name] || { vn: name, en: '', unit: '', price: 0 };
      const r = rowsByItem.get(name);
      let total = 0; const teams = [];
      TEAM_COLS.forEach(c => { if(r[c.team]){ total += r[c.team]; teams.push(c.team); } });
      return { name: name, it: it, r: r, total: r3(total), teams: teams };
    });

    // ---------- Sheet "purchase request" ----------
    let rows1 = '', sumAmt = 0;
    data.forEach((x, i) => {
      const r = 13 + i, amt = r3(x.total * x.it.price);
      sumAmt += amt;
      rows1 += `<row r="${r}" spans="1:13" s="29" customFormat="1" ht="55.5" customHeight="1">` +
        fml('A' + r, 'ROW()-12', i + 1, 31) + str('B' + r, x.it.vn, 32) + str('C' + r, x.it.en, 32) + str('D' + r, x.it.unit, 33) +
        num('E' + r, x.it.price, 34) + num('F' + r, x.total, 35) + fml('G' + r, `F${r}*E${r}`, amt, 36) +
        str('H' + r, 'QA Stationery', 37) + str('I' + r, x.teams.join(', '), 33) + blank('J' + r, 33) + '</row>';
    });
    sumAmt = r3(sumAmt);
    const vat = r3(sumAmt * 0.08), grand = r3(sumAmt + vat);
    let tail = T.s1tail

  // Clustered columns per team: Previous Month (dark grey) next to Current Month (team colour).

  function renderBarChart(curList, prevList, curLabel, prevLabel){

    const labels = [];
    rows.forEach(row => {
      const span = row.val / total * Math.PI * 2, a1 = a0 + span, am = (a0 + a1) / 2;
      const pct = row.val / total * 100;
      const tip = `<title>${escapeHtml(row.team)}: ${fmtVnd(row.val)} VND incl. VAT (${pct.toFixed(1)}%)</title>`;
      if(span >= Math.PI * 2 - 1e-6){
        s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${row.color}">${tip}</circle>`;
      } else {
        const p0 = pt(R, a0), p1 = pt(R, a1), large = span > Math.PI ? 1 : 0;
        s += `<path d="M${cx} ${cy} L${f(p0[0])} ${f(p0[1])} A${R} ${R} 0 ${large} 1 ${f(p1[0])} ${f(p1[1])} Z" fill="${row.color}" stroke="#fff" stroke-width="1.5">${tip}</path>`;
      }
      if(pct >= 2.5){
        const ip = pt(R * (pct < 8 ? 0.78 : 0.62), am);
        s += `<text x="${f(ip[0])}" y="${f(ip[1] + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" pointer-events="none">${pct.toFixed(1)}%</text>`;
      }
      const side = Math.cos(am) >= 0 ? 1 : -1, e1 = pt(R, am), e2 = pt(R + GAP, am);
      labels.push({ row:row, pct:pct, side:side, e1:e1, e2:e2, y:e2[1] });
      a0 = a1;
    });
    // keep labels on the same side from overlapping (at least 14px apart)
    [1, -1].forEach(side => {
      const grp = labels.filter(l => l.side === side).sort((a, b) => a.y - b.y);
      for(let i = 0; i < grp.length; i++){
        if(i > 0 && grp[i].y < grp[i - 1].y + 14) grp[i].y = grp[i - 1].y + 14;
        grp[i].y = Math.min(Math.max(grp[i].y, 10), H - 8);
      }
      for(let i = grp.length - 2; i >= 0; i--){ if(grp[i].y > grp[i + 1].y - 14) grp[i].y = grp[i + 1].y - 14; }
    });
    labels.forEach(l => {
      const x3 = l.e2[0] + l.side * 14;
      s += `<polyline points="${f(l.e1[0])},${f(l.e1[1])} ${f(l.e2[0])},${f(l.e2[1])} ${f(x3)},${f(l.y)}" fill="none" stroke="${l.row.color}" stroke-width="1"/>`;
      const txt = escapeHtml(l.row.team) + (l.pct < 2.5 ? ' ' + l.pct.toFixed(1) + '%' : '');
      s += `<text x="${f(x3 + l.side * 4)}" y="${f(l.y + 4)}" text-anchor="${l.side > 0 ? 'start' : 'end'}" font-size="12" fill="${l.row.color}">${txt}</text>`;
    });
    return `<div class="pie-wrap">${s}</svg></div>`;
  }

  function renderStackChart(list){
    const rows = TEAMS.map(t => {
      const cats = {}; let total = 0;
      list.filter(e => e.team === t).forEach(e => { const c = entryCost(e); cats[itemCat(e.itemVN)] = (cats[itemCat(e.itemVN)] || 0) + c; total += c; });
      return { team:t, cats:cats, total:total };
    }).filter(r => r.total > 0).sort((a, b) => b.total - a.total);
    if(!rows.length) return emptyHtml();
    let html = '<div class="stk-legend">' + CATS.map(c => `<span><i class="dot" style="background:${c.color}"></i>${escapeHtml(c.name)}</span>`).join('') + '</div>';
    rows.forEach(r => {
      const segs = CATS.filter(c => r.cats[c.key] > 0).map(c => {
        const p = r.cats[c.key] / r.total * 100;
        return `<div style="width:${p}%;background:${c.color}" title="${attr(r.team + ' - ' + c.name + ': ' + fmtVnd(r.cats[c.key]) + ' VND incl. VAT (' + p.toFixed(1) + '%)')}">${p >= 9 ? Math.round(p) + '%' : ''}</div>`;
      }).join('');
      html += `<div class="stk-row"><div class="nm" title="${attr(r.team)}">${escapeHtml(r.team)}</div><div class="stk-bar">${segs}</div><div class="tot">${compact(r.total)}</div></div>`;
    });
    return html;
  }

  function renderSummaryCharts(){
    // Year applies to Current Month. A Previous Month that is the same as or later in the calendar than
    // Current Month belongs to the year before (e.g. Current = Jan, Previous = Dec -> Dec of last year).
    const yC = Number(sumEls.y1.value), mC = sumEls.m1.value, mP = sumEls.pm.value;
    const yP = MONTHS.indexOf(mP) >= MONTHS.indexOf(mC) ? yC - 1 : yC;
    const curLabel = mC + ' ' + yC, prevLabel = mP + ' ' + yP;
    const curList = entries.filter(e => e.year === yC && e.month === mC);
    const prevList = entries.filter(e => e.year === yP && e.month === mP);
    const sum = l => l.reduce((s, e) => s + entryCost(e), 0);
    document.getElementById('sumPeriodNote').textContent =
      'Total (included VAT): ' + prevLabel + ' ' + fmtVnd(sum(prevList)) + ' · ' + curLabel + ' ' + fmtVnd(sum(curList)) + ' VND';
    document.getElementById('chartBar').innerHTML = renderBarChart(curList, prevList, curLabel, prevLabel);
    document.getElementById('chartPie').innerHTML = renderPieChart(entries.filter(e => periodMatch(e, sumEls.y3.value, sumEls.m3.value)));
    document.getElementById('chartStack').innerHTML = renderStackChart(entries.filter(e => periodMatch(e, sumEls.y4.value, sumEls.m4.value)));
  }

  function renderItemChart(){
    const y = sumEls.y2.value, m = sumEls.m2.value, t = sumEls.t2.value;
    const agg = new Map();
    entries.filter(e => periodMatch(e, y, m) && (!t || e.team === t)).forEach(e => {
      const a = agg.get(e.itemVN) || { vn:e.itemVN, qty:0, cost:0 };
      a.qty += e.qty; a.cost += entryCost(e); agg.set(e.itemVN, a);
    });
    const rows = Array.from(agg.values()).sort((a, b) => b.cost - a.cost);
    const total = rows.reduce((s, r) => s + r.cost, 0);
    document.getElementById('itemsNote').textContent = 'Total (included VAT): ' + fmtVnd(total) + ' VND';
    const box = document.getElementById('chartItems');
    if(!rows.length){ box.innerHTML = emptyHtml(); return; }
    const max = rows[0].cost || 1;
    box.innerHTML = '<div class="items-scroll">' + rows.map(r => {
      const it = ITEM_MAP[r.vn] || { en:'', unit:'' };
      return `<div class="it-row"><div><div>${escapeHtml(r.vn)}</div><div class="en">${escapeHtml(it.en)}</div></div>` +
        `<div class="it-bar"><div class="fill" style="width:${Math.max(r.cost / max * 72, 0.5)}%"></div><span class="lbl">${fmtNum(r.qty)} ${escapeHtml(it.unit)}</span></div>` +
        `<div class="it-val"><b>${fmtVnd(r.cost)}</b><span class="mqty"><br><span class="en">${fmtNum(r.qty)} ${escapeHtml(it.unit)}</span></span></div></div>`;
    }).join('') + '</div>';
  }

  [sumEls.y1, sumEls.pm, sumEls.m1].forEach(el => el.addEventListener('change', () => { cmpTouched = true; renderSummaryCharts(); }));
  [sumEls.y3, sumEls.m3].forEach(el => el.addEventListener('change', () => { pieTouched = true; renderSummaryCharts(); }));
  [sumEls.y4, sumEls.m4].forEach(el => el.addEventListener('change', () => { stkTouched = true; renderSummaryCharts(); }));
  [sumEls.y2, sumEls.m2, sumEls.t2].forEach(el => el.addEventListener('change', renderItemChart));
  tabButtons.forEach(btn => {
    if(btn.dataset.tab === 'summary') btn.addEventListener('click', () => { refreshSummaryOptions(); renderSummaryCharts(); renderItemChart(); });
  });

  // Init: show the last copy kept in this browser at once, then load the latest from the Google Sheet
  loadLocal();
  try{ setCatalog(JSON.parse(localStorage.getItem(CATALOG_KEY) || '[]')); }catch(e){ setCatalog([]); }
  yearEl.value = new Date().getFullYear();
  resetItemFields();
  initialPeriod();
  renderEntryList();
  setSync(apiConfigured() ? 'loading' : 'noapi');
  (async function boot(){
    const localEntries = entries.map(e => Object.assign({}, e));     // saved in this browser before the sheet was used
    if(!(await loadRemote(false))) return;
    try{
      if(!localStorage.getItem(SEEN_KEY)){
        localStorage.setItem(SEEN_KEY, '1');
        if(!entries.length && localEntries.length){
          openConfirm(`Upload ${localEntries.length} entries saved in this browser to Google Sheet? (No = discard them)`, () => {
            const ops = [];
            localEntries.forEach(e => {
              const r = upsertEntry({ year: e.year, month: e.month, team: e.team, itemVN: canonVN(e.itemVN), qty: e.qty });
              ops.push(opOf('set', r.entry));
            });
            saveLocal(); queueOps(ops); renderEntryList();
          });
        }
      }
    }catch(e){}
  })();
</script>
